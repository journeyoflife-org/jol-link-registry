name: Compliance Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install detect-secrets
      - name: Scan for secrets
        run: |
          # Scan using the audited baseline; new findings get added in-place
          detect-secrets scan --all-files \
            --exclude-files '\.venv/.*' \
            --exclude-files '\.idea/.*' \
            --exclude-files '__pycache__/.*' \
            --exclude-files '\.mypy_cache/.*' \
            --exclude-files '\.pytest_cache/.*' \
            --exclude-files '\.ruff_cache/.*' \
            --baseline .secrets.baseline .
          # Fail only on NEW secrets not yet in the audited baseline
          python -c "
          import json, sys
          with open('.secrets.baseline') as f:
              data = json.load(f)
          new_secrets = []
          for path, secrets in data.get('results', {}).items():
              for s in secrets:
                  if 'is_secret' not in s:
                      new_secrets.append(f'{path}:{s.get(\"line_number\", \"?\")}')
          if new_secrets:
              print(f'ERROR: {len(new_secrets)} new unaudited secret(s) found:')
              for loc in new_secrets:
                  print(f'  {loc}')
              sys.exit(1)
          print('No new secrets detected. All known findings are audited.')
          "

  pii-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: python scripts/verify_zero_pii.py

  bandit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install bandit[toml]
      - run: bandit -c pyproject.toml -r app/
