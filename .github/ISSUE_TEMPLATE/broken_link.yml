name: Broken Link Report
description: Report a broken or invalid link in the registry
labels: ["broken-link"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a broken link!
  - type: input
    id: url
    attributes:
      label: Broken URL
      description: The URL that is no longer working.
    validations:
      required: true
  - type: input
    id: category
    attributes:
      label: Category
      description: The category the link belongs to.
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Any additional details about the broken link.
